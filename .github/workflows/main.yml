name: Deploy SIEM Rules to Splunk

on:
  push:
    branches: [ main ] # Или master, в зависимости от того, как называется твоя ветка

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pyyaml urllib3

      - name: Run Splunk sync script
        env:
          SPLUNK_HOST: ${{ secrets.SPLUNK_HOST }}
          SPLUNK_PORT: ${{ secrets.SPLUNK_PORT }}
          SPLUNK_USER: ${{ secrets.SPLUNK_USER }}
          SPLUNK_PASS: ${{ secrets.SPLUNK_PASS }}
        run: |
          cd Scripts
          python3 deploy_splunk_rules.py
