title: Detect Failed Domain Controller Backup
description: Active Directory System State backup failure detection (Windows Server Backup).
level: high
logsource:
    product: windows
    service: application
detection:
    selection:
        SourceName: 'Microsoft-Windows-Backup'
        EventID: [517, 521]
    condition: selection
# --- Splunk SPL Query ---
# index=windows sourcetype=WinEventLog:Application source="Microsoft-Windows-Backup" (EventCode=517 OR EventCode=521)
#
# Active Directory ehtiyat nüsxəsinin (System State backup) alınması zamanı xəta baş verdi.
# 517 - ümumi backup xətası, 521 - Volume Shadow Copy (VSS) xətası.
