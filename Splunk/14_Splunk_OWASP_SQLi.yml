title: OWASP Top 10 - SQL Injection Attempt
description: >
    Detects SQL Injection payloads in web server request logs, covering UNION-based,
    boolean-based and time-based blind techniques.
level: high
logsource:
    category: webserver
    product: nginx
detection:
    selection_union:
        c_uri|contains:
            - 'UNION SELECT'
            - 'union select'
            - 'UNION ALL SELECT'
    selection_boolean:
        c_uri|contains:
            - 'OR 1=1'
            - "OR '1'='1"
            - 'OR 1 = 1'
            - "' OR 'a'='a"
    selection_blind:
        c_uri|contains:
            - 'SLEEP('
            - 'sleep('
            - 'WAITFOR DELAY'
            - 'BENCHMARK('
    selection_error_based:
        c_uri|contains:
            - 'CONVERT('
            - 'CAST('
            - 'extractvalue('
            - 'updatexml('
    condition: 1 of selection_*
