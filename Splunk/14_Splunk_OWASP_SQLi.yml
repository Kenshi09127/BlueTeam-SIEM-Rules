title: OWASP Top 10 - SQL Injection Attempt
description: >
    Detects SQL Injection payloads in web server request logs, covering UNION-based,
    boolean-based and time-based blind techniques.
level: high
logsource:
    category: webserver
    product: nginx
detection:
    selection_union:
        c_uri|contains:
            - 'UNION SELECT'
            - 'union select'
            - 'UNION ALL SELECT'
    selection_boolean:
        c_uri|contains:
            - 'OR 1=1'
            - "OR '1'='1"
            - 'OR 1 = 1'
            - "' OR 'a'='a"
    selection_blind:
        c_uri|contains:
            - 'SLEEP('
            - 'sleep('
            - 'WAITFOR DELAY'
            - 'BENCHMARK('
    selection_error_based:
        c_uri|contains:
            - 'CONVERT('
            - 'CAST('
            - 'extractvalue('
            - 'updatexml('
    condition: 1 of selection_*
# --- Splunk SPL Query ---
# index=web sourcetype=nginx:access
# (uri_path="*UNION SELECT*" OR uri_path="*union select*" OR uri_path="*UNION ALL SELECT*"
#  OR uri_path="*OR 1=1*" OR uri_path="*OR '1'='1*" OR uri_path="*' OR 'a'='a*"
#  OR uri_path="*--*" OR uri_path="*#*" OR uri_path="*/\**" OR uri_path="*';*"
#  OR uri_path="*SLEEP(*" OR uri_path="*WAITFOR DELAY*" OR uri_path="*BENCHMARK(*")
#
# Veb-serverə SQL Injection (SQLi) hücumu cəhdi — UNION-based, boolean-based, blind.
