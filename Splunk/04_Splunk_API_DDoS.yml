title: API DDoS Attack Detection
description: Spike in API requests from a single source IP indicating a potential DDoS.
level: high
logsource:
    category: webserver
    product: nginx
detection:
    selection:
        c_uri|contains: '/api/'
    timeframe: 1m
    condition: selection | count() by src_ip > 1000
# --- Splunk SPL Query ---
# Eyni IP-dən API-yə 1 dəqiqə ərzində 1000-dən çox sorğu gəlir (DDoS ehtimalı).
